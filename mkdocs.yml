site_name: The Rollup0 Protocol Specification
site_description: >-
  A self-contained, client-agnostic, normative specification of Rollup0 — an EVM
  rollup with synchronous L1↔L2 composability.
docs_dir: docs/rollup0-spec
site_dir: docs/rollup0-spec-site
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

nav:
  - Home: README.md
  - "1. Overview & Scope": 01-overview.md
  - "2. Architecture": 02-architecture.md
  - "3. EVM, Proxy & System Tx": 03-evm-proxy-systemtx.md
  - "4. Block Production & Headers": 04-block-production.md
  - "5. Execution Model": 05-execution-model.md
  - "6. The Composer": 06-composer.md
  - "7. DA, Batches & Bundles": 07-da-batches-bundles.md
  - "8. Proving & Settlement": 08-proving-settlement.md
  - "9. L1 → L2 Flow": 09-l1-to-l2.md
  - "10. Derivation & Following": 10-derivation-following.md
  - "11. Gas & Economics": 11-gas-economics.md
  - "12. Open Issues & Limitations": 12-open-issues.md
  - "13. Rollup1 & the General Model": 13-rollup1-general-model.md
  - "Appendix A — Reference": A-reference.md
  - "Appendix B — Gas & Cost Analysis": B-gas-cost-analysis.md
  - "Appendix C — Open Questions": C-open-questions.md
  - "Appendix D — Wire Formats & Vectors": D-wire-formats.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Full specification (one page)"
      add_print_site_banner: false
      add_table_of_contents: true
      enumerate_headings: false
      add_cover_page: false
