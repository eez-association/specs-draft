site_name: EEZ Specifications
site_description: >-
  The implementation-independent EEZ Framework Specification and separate Rollup0
  and Gnosis Chain EEZ network specifications.
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  rollup0-spec-site/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

nav:
  - "Start Here: Specification Set": index.md
  - "EEZ Framework / eez-evm@0.2-draft":
      - "Overview & Edition Boundary": eez-protocol-spec/index.md
      - "1. Scope & Conformance": eez-protocol-spec/01-scope-conformance.md
      - "2. Architecture": eez-protocol-spec/02-architecture.md
      - "3. EVM Binding": eez-protocol-spec/03-evm-binding.md
      - "4. Execution Model": eez-protocol-spec/04-execution-model.md
      - "5. Proving & Settlement": eez-protocol-spec/05-proving-settlement.md
      - "6. Security & Trust Model": eez-protocol-spec/06-security-model.md
      - "7. Required Network Profile": eez-protocol-spec/07-network-profile.md
      - "Appendix A — Protocol Reference": eez-protocol-spec/A-reference.md
      - "Appendix B — Wire Formats & Vectors": eez-protocol-spec/B-wire-formats.md
      - "Appendix C — Protocol Open Questions": eez-protocol-spec/C-open-questions.md
  - "Rollup0 v0 / eez-evm@0.1-rollup0":
      - "Overview & Implementer Path": rollup0-network-spec/index.md
      - "0. Protocol Version & Compatibility": rollup0-network-spec/00-protocol-version.md
      - "1. Network Profile": rollup0-network-spec/01-profile.md
      - "2. Block Production & Headers": rollup0-network-spec/02-block-production.md
      - "3. The Composer": rollup0-network-spec/03-composer.md
      - "4. DA, Batches & Bundles": rollup0-network-spec/04-da-batches-bundles.md
      - "5. Cross-Chain Flows": rollup0-network-spec/05-l1-to-l2.md
      - "6. Derivation & Following": rollup0-network-spec/06-derivation-following.md
      - "7. Gas & Economics": rollup0-network-spec/07-gas-economics.md
      - "8. Limitations & Release Blockers": rollup0-network-spec/08-limitations.md
      - "9. Security & Trust Model": rollup0-network-spec/09-security-trust-model.md
      - "10. Future Design: Rollup1": rollup0-network-spec/10-future-design.md
      - "Appendix A — Gas & Cost Analysis": rollup0-network-spec/A-gas-cost-analysis.md
      - "Appendix B — DA Codec Vector": rollup0-network-spec/B-da-codec.md
      - "Appendix C — Signed System Transactions": rollup0-network-spec/C-system-transactions.md
      - "Appendix D — Genesis & Block Validity": rollup0-network-spec/D-genesis-validity.md
      - "Appendix E — Compatibility Binding": rollup0-network-spec/E-compatibility-binding.md
  - Gnosis Chiado Host Profiles:
      - "Overview & Profile Selection": gnosis-chain-eez-spec/index.md
      - "1. Host Profile": gnosis-chain-eez-spec/01-host-profile.md
      - "2. Deployment & Release Blockers": gnosis-chain-eez-spec/02-deployment.md
      - "3. Security & Trust Model": gnosis-chain-eez-spec/03-security-trust-model.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Full specification (one page)"
      add_print_site_banner: false
      add_table_of_contents: true
      enumerate_headings: false
      add_cover_page: false
