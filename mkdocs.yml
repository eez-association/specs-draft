site_name: EEZ Specifications
site_description: >-
  Separate specifications for the EEZ framework, the Rollup0 network, and the
  Gnosis Chain network.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

nav:
  - Specifications: index.md
  - EEZ Protocol:
      - Overview: eez-protocol-spec/index.md
      - "1. Architecture": eez-protocol-spec/01-architecture.md
      - "2. EVM and Cross-Chain Proxies": eez-protocol-spec/02-evm-and-proxies.md
      - "3. Execution Model": eez-protocol-spec/03-execution-model.md
      - "4. Proving and Settlement": eez-protocol-spec/04-proving-and-settlement.md
      - "5. Wire Formats and Vectors": eez-protocol-spec/05-wire-formats.md
  - Rollup0:
      - Overview: rollup0-spec/index.md
      - "1. Overview and Scope": rollup0-spec/01-overview.md
      - "2. Architecture": rollup0-spec/02-architecture.md
      - "3. EVM, Proxy, and System Transactions": rollup0-spec/03-evm-proxy-systemtx.md
      - "4. Block Production and Headers": rollup0-spec/04-block-production.md
      - "5. Execution Profile": rollup0-spec/05-execution-model.md
      - "6. Composer and Candidate Competition": rollup0-spec/06-composer.md
      - "7. Data Availability, Batches, and Bundles": rollup0-spec/07-da-batches-bundles.md
      - "8. Proving and Settlement": rollup0-spec/08-proving-settlement.md
      - "9. Ethereum to Rollup0 Flow": rollup0-spec/09-l1-to-l2.md
      - "10. Derivation and Following": rollup0-spec/10-derivation-following.md
      - "11. Gas and Economics": rollup0-spec/11-gas-economics.md
      - "12. Limitations and Open Issues": rollup0-spec/12-open-issues.md
      - "Appendix A: Reference": rollup0-spec/A-reference.md
      - "Appendix B: Gas and Cost Model": rollup0-spec/B-gas-cost-analysis.md
      - "Appendix C: Open Questions": rollup0-spec/C-open-questions.md
      - "Appendix D: Rollup0 Wire Format": rollup0-spec/D-wire-formats.md
  - Gnosis Chain: gnosis-chain-spec/index.md

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Full specification (one page)"
      add_print_site_banner: false
      add_table_of_contents: true
      enumerate_headings: false
      add_cover_page: false
